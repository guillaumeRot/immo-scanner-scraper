name: Rapport d'erreurs

on:
  schedule:
    # 20 min après le run horaire de scraping (0 * * * *), pour lui laisser le temps de finir.
    - cron: "20 * * * *"
  workflow_dispatch: {}

concurrency:
  group: notify-errors
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: node scripts/notify.js errors
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
