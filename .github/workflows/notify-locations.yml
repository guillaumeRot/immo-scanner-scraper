name: Notifications locations

on:
  schedule:
    # 15 min après le run horaire de scraping (0 * * * *), pour lui laisser le temps de finir.
    - cron: "15 * * * *"
  workflow_dispatch: {}

concurrency:
  group: notify-locations
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: node scripts/notify.js locations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
